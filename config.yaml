# config.yaml

# Coinbase Advanced Trade (default path for live trading)
coinbase:
  # Preferred quote asset for mapping tickets to product IDs (BTC-USD, ETH-USDC, etc.)
  # You can override via env: COINBASE_QUOTE_ASSET
  quote_asset: "USD"

# Risk settings (informational + to keep in sync with brackets.target_notional_usd)
risk:
  bankroll_usd: 100 # starting bankroll
  max_trade_pct: 5 # cap per trade as % of bankroll (5% of $100 = $5)
  notes: "run_strategy.py currently sizes with brackets.target_notional_usd; keep it aligned with bankroll * max_trade_pct."

# Bracket behavior and sizing used by the runners/strategy
brackets:
  # If the trade ticket provides take_profit/stop, the runner will use them.
  # Otherwise it derives the following:
  tp_offset_bps: 30 # +0.30% above entry (30 bps)
  min_stop_pct: 0.5 # -0.50% below entry (floor)
  post_only: true # place entry as maker
  target_notional_usd: 5 # derived from bankroll ($100) * max_trade_pct (5%) = $5

# (Optional) Legacy venue notes for reference only
binance:
  enabled: false
  notes: "Deprecated for NC; switched to Coinbase Advanced."

kraken:
  enabled: false
  notes: "Removed from strategy path; kept only as historical reference."
