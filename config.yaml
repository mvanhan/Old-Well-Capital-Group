# TEMP live-test config.yaml

general:
  timezone: "UTC"

live:
  # Turn OFF paper trading for this test
  dry_run: false

screen:
  take: 1 # only place one trade candidate
  min_vol_usd: 0 # keep wide for the test

risk:
  nav_usd: 100 # bankroll
  per_trade_pct: 1.0 # 1.0 = 1% of NAV risked per trade (per your comments)
  single_trade_cap_usd: 10 # hard cap on order notional to stay tiny
  min_stop_pct: 0.005 # 0.5% min stop floor to avoid over-tight rejects
  slippage_bps: 8
  min_realized_risk_frac: 0.0 # do not filter out on realized-risk for this test
  max_portfolio_risk_pct: 1.0

exchange:
  fees:
    maker_bps: 25
    taker_bps: 40
  # keep CoinGecko key in .env, do not put it here

strategy:
  atr_5m_window: 14
  stop_atr_mult_5m: 8
  tp_atr_mult_5m: 20
  maker_spread_fraction: 0.30 # a bit tighter so entries pass

# Optional knobs some broker modules use; harmless if ignored by your code
broker:
  stop_order_type: market # ensure stop is a MARKET order
  time_in_force: GTC

logging:
  trade_log_path: logs/executions.csv # if your broker writes fills, point it here
  pnl_log_path: logs/pnl_live.csv
  log_execution_timing: true
