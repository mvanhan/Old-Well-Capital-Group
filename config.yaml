# =========================
# OWCG – FULL CONFIG (drop-in)
# =========================

live:
  dry_run: false # safety default
  timezone: "UTC"

api:
  kraken_key: "${KRAKEN_API_KEY}"
  kraken_secret_b64: "${KRAKEN_API_SECRET_B64}" # base64-encoded raw secret (Kraken style)
  coingecko_key: "${COINGECKO_API_KEY}"

fees_bps:
  maker: 0.0
  taker: 20.0

risk:
  nav_usd: 10000 # keep as-is (or your real NAV)
  per_trade_pct: 0.0005 # 0.05% of NAV (5 bps) → very small risk driver
  single_trade_cap_usd: 10
  min_realized_risk_fraction: 0.15

screen:
  universe: ["BTC", "ETH", "SOL", "APT", "FLOKI"] # symbols (spot) to scan
  min_vol_usd_24h: 50000

alpha:
  take: 1 # how many tickets to return
  min_score: 0.0
  normalize: zscore # zscore | minmax | none

  weights:
    maker_edge: 0.50
    funding_crowding: 0.20
    liquidity_fragility: 0.15
    fragmentation: 0.10
    legacy: 0.25

  rv_window_minutes: 1440
  atr_window_minutes: 1440
  orderbook_levels: 5
  our_order_usd: 50

  fees_bps:
    maker: 0.0
    taker: 20.0

  funding:
    enable: true
    fade_threshold_z: 1.0
    carry_threshold_z: -1.0
    lookback_hours: 24

  fragmentation:
    venues: ["kraken"] # extend later: coinbase, binance, etc.
    min_cross_venue_spread_bps: 2.0

overlays:
  events_file: "events.yaml"
  block_during_events: true
  pre_event_minutes: 5
  post_event_minutes: 10

brackets:
  use_ws_v2: true
  tp_exit: "limit" # "limit" | "market"
  tp_offset_bps: 12 # default TP distance if strategy doesn’t override
  cancel_timeout_ms: 500

execution:
  oflags_entry: "post"
  price_round_dp: 8
  qty_round_dp: 8
