# config.yaml

# Coinbase Advanced Trade (default path for live trading)
coinbase:
  # Preferred quote asset for mapping tickets to product IDs (BTC-USD, ETH-USDC, etc.)
  # You can override via env: COINBASE_QUOTE_ASSET
  quote_asset: "USD"

# Bracket behavior shared by the Coinbase runner
brackets:
  # If the trade ticket provides take_profit/stop, the runner will use them.
  # Otherwise it derives the following:
  tp_offset_bps: 30 # +0.30% above entry (30 bps)
  min_stop_pct: 0.5 # -0.50% below entry (floor)
  post_only: true # place entry as maker

# (Optional) Keep prior venues for reference/fallback; not used by run_live_coinbase.py
binance:
  enabled: false
  notes: "Deprecated for NC; switched to Coinbase Advanced."

kraken:
  enabled: false
  notes: "Kept for historical reference."
