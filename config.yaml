# # config.yaml

# general:
#   timezone: "UTC"

# live:
#   # Safety switch: when true, order submits are printed (no real trades).
#   # Flip to false to go live.
#   dry_run: true

# risk:
#   nav_usd: 1500 # your account size in USD
#   per_trade_pct: 0.50 # % of NAV risked per trade (0.50 = 0.50%)
#   single_trade_cap_usd: 75 # max notional per order while testing
#   min_stop_pct: 0.0125 # stop floor as % of entry (e.g., 0.0125 = 1.25%)
#   slippage_bps: 8 # assumed exit slippage (bps = 0.01%)
#   min_realized_risk_frac: 0.40 # skip if realized risk < 40% of intended
#   max_portfolio_risk_pct: 1.0 # cap total open risk as % of NAV

# exchange:
#   fees:
#     maker_bps: 25 # maker fee in bps (0.25%)
#     taker_bps: 40 # taker fee in bps (0.40%)
#   # Optional: set here or via env var COINGECKO_API_KEY
#   coingecko_api_key: ""

# strategy:
#   atr_5m_window: 14 # ATR window on 5-minute prices
#   stop_atr_mult_5m: 8 # stop = 8 × ATR(5m)
#   tp_atr_mult_5m: 20 # target = 20 × ATR(5m) (~2.5R if stop=8×ATR)
#   maker_spread_fraction: 0.5 # fraction of median spread aimed to capture on entry

# screen:
#   take: 2 # trade top N names from screen
#   min_vol_usd: 20000000 # liquidity filter (24h volume in USD)

# # (Optional) If you want to fix the universe here instead of defaults:
# # universe:
# #   - [ "dogwifcoin", "WIF" ]
# #   - [ "bonk", "BONK" ]
# #   - [ "pepe", "PEPE" ]
# #   - [ "floki", "FLOKI" ]
# #   - [ "book-of-meme", "BOME" ]
# #   - [ "ordinals", "ORDI" ]
# #   - [ "sui", "]()

# config.yaml (relaxed for testing)
#
#
#
#
general:
  timezone: "UTC"

live:
  # Safety switch: true = paper trading only
  dry_run: true

screen:
  take: 8 # widen the funnel
  min_vol_usd: 0 # disable liquidity filter for now

risk:
  nav_usd: 1500
  per_trade_pct: 0.50
  single_trade_cap_usd: 200 # allow calc to size tickets
  min_stop_pct: 0.005 # 0.5% stop floor (vs 1.25% before)
  slippage_bps: 8
  min_realized_risk_frac: 0.0 # don’t reject on low realized risk
  max_portfolio_risk_pct: 1.0

exchange:
  fees:
    maker_bps: 25
    taker_bps: 40
  # coingecko_api_key can come from .env instead

strategy:
  atr_5m_window: 14
  stop_atr_mult_5m: 8
  tp_atr_mult_5m: 20
  maker_spread_fraction: 0.30 # slightly tighter to let more pass
